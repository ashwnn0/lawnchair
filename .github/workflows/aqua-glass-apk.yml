name: Aqua Glass APK

on:
  push:
    branches:
      - aqua-glass-build-dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aqua Glass
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build APK
        run: ./gradlew assembleLawnWithQuickstepNightlyRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Aqua-Glass-APK
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aqua-glass-build-${{ github.run_number }}
          name: Aqua Glass build ${{ github.run_number }}
          body: Automated Aqua Glass launcher build from commit ${{ github.sha }}.
          prerelease: true
          files: build/outputs/apk/**/*.apk
